appId: com.skyler.planner
productName: Planner
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - dist-electron/**
# Everything is bundled by Vite; no node_modules ship in the asar.
npmRebuild: false
# Ship the window icon so the running app can set it (the taskbar button uses
# the window icon, not the exe icon) — loaded from process.resourcesPath.
extraResources:
  - from: build/icon-256.png
    to: icon-256.png
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Planner
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
