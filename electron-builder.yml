appId: com.skyler.planner
productName: Planner
directories:
  buildResources: build
  output: release
files:
  - dist/**
  - dist-electron/**
# Everything is bundled by Vite; no node_modules ship in the asar.
npmRebuild: false
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  shortcutName: Planner
  deleteAppDataOnUninstall: false
  artifactName: ${productName}-Setup-${version}.${ext}
